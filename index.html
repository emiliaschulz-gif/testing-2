<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURA | Daily Life & Digital Wardrobe</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..700;1,400..700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        alabaster: '#FAF9F6',
                        charcoal: '#2A2827',
                        sage: '#8A9A86',
                        'sage-light': '#E2E8E1',
                        sand: '#EAE5D9',
                        warmgray: '#8C857B'
                    },
                    fontFamily: {
                        serif: ['Playfair Display', 'serif'],
                        sans: ['Plus Jakarta Sans', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #FAF9F6;
            color: #2A2827;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        .font-serif { font-family: 'Playfair Display', serif; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #FAF9F6; }
        ::-webkit-scrollbar-thumb { background: #D1CDC4; border-radius: 9999px; }
        ::-webkit-scrollbar-thumb:hover { background: #8A9A86; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <!-- Navigation Header -->
    <header class="sticky top-0 z-40 bg-alabaster/90 backdrop-blur-md border-b border-sand">
        <div class="max-w-6xl mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-2">
                <span class="w-8 h-8 rounded-full bg-sage text-white flex items-center justify-center font-serif text-lg italic">A</span>
                <h1 class="text-2xl font-serif font-semibold tracking-wide">AURA</h1>
                <span class="text-xs text-warmgray uppercase tracking-widest pl-2 border-l border-sand">Studio & Living</span>
            </div>
            
            <nav class="flex items-center gap-1 bg-sand/40 p-1 rounded-full text-xs md:text-sm font-medium">
                <button onclick="switchTab('todo')" id="nav-todo" class="nav-btn px-4 py-1.5 rounded-full bg-charcoal text-white transition-all">To-Do</button>
                <button onclick="switchTab('closet')" id="nav-closet" class="nav-btn px-4 py-1.5 rounded-full text-charcoal hover:bg-white/60 transition-all">Digital Closet</button>
                <button onclick="switchTab('builder')" id="nav-builder" class="nav-btn px-4 py-1.5 rounded-full text-charcoal hover:bg-white/60 transition-all">Outfit Studio</button>
                <button onclick="switchTab('tips')" id="nav-tips" class="nav-btn px-4 py-1.5 rounded-full text-charcoal hover:bg-white/60 transition-all">Life Playbook</button>
            </nav>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="max-w-6xl mx-auto px-4 py-8 flex-1 w-full">

        <!-- SECTION 1: TO-DO LIST -->
        <section id="section-todo" class="tab-section space-y-6">
            <div class="flex flex-col md:flex-row md:items-end justify-between gap-4 pb-4 border-b border-sand">
                <div>
                    <span class="text-xs font-semibold text-sage uppercase tracking-wider">Daily Intentions</span>
                    <h2 class="text-3xl font-serif font-bold text-charcoal">Organized Checklist</h2>
                </div>
                <!-- Progress Bar -->
                <div class="bg-white border border-sand p-4 rounded-xl w-full md:w-72 shadow-sm">
                    <div class="flex justify-between text-xs mb-1 font-medium">
                        <span class="text-warmgray">Today's Progress</span>
                        <span id="progress-percent" class="text-sage font-bold">0%</span>
                    </div>
                    <div class="w-full bg-sand/50 h-2 rounded-full overflow-hidden">
                        <div id="progress-bar" class="bg-sage h-full w-0 transition-all duration-300"></div>
                    </div>
                </div>
            </div>

            <!-- Task Input Form -->
            <form id="todo-form" onsubmit="addTask(event)" class="bg-white p-4 rounded-2xl border border-sand shadow-sm flex flex-col md:flex-row gap-3">
                <input type="text" id="task-input" placeholder="What would you like to accomplish today?" required class="flex-1 bg-alabaster border border-sand/80 px-4 py-2.5 rounded-xl text-sm focus:outline-none focus:border-sage transition-all">
                <select id="task-category" class="bg-alabaster border border-sand/80 px-4 py-2.5 rounded-xl text-sm font-medium text-charcoal focus:outline-none focus:border-sage">
                    <option value="Routine">Routine</option>
                    <option value="Style">Style</option>
                    <option value="Work">Work</option>
                    <option value="Personal">Personal</option>
                </select>
                <button type="submit" class="bg-charcoal text-white px-6 py-2.5 rounded-xl text-sm font-medium hover:bg-sage transition-all flex items-center justify-center gap-2">
                    <i class="fa-solid fa-plus text-xs"></i> Add Task
                </button>
            </form>

            <!-- Filter Buttons -->
            <div class="flex items-center gap-2 overflow-x-auto pb-2 text-xs">
                <span class="text-warmgray font-medium mr-1">Filter:</span>
                <button onclick="filterTasks('all')" class="task-filter-btn px-3 py-1 rounded-full bg-charcoal text-white" data-category="all">All</button>
                <button onclick="filterTasks('Routine')" class="task-filter-btn px-3 py-1 rounded-full bg-sand/50 text-charcoal hover:bg-sand" data-category="Routine">Routine</button>
                <button onclick="filterTasks('Style')" class="task-filter-btn px-3 py-1 rounded-full bg-sand/50 text-charcoal hover:bg-sand" data-category="Style">Style</button>
                <button onclick="filterTasks('Work')" class="task-filter-btn px-3 py-1 rounded-full bg-sand/50 text-charcoal hover:bg-sand" data-category="Work">Work</button>
                <button onclick="filterTasks('Personal')" class="task-filter-btn px-3 py-1 rounded-full bg-sand/50 text-charcoal hover:bg-sand" data-category="Personal">Personal</button>
            </div>

            <!-- Task List Grid -->
            <div id="todo-list" class="space-y-3">
                <!-- Dynamic Content -->
            </div>
        </section>

        <!-- SECTION 2: DIGITAL CLOSET PHOTO UPLOADER -->
        <section id="section-closet" class="tab-section hidden space-y-6">
            <div class="flex flex-col md:flex-row md:items-end justify-between gap-4 pb-4 border-b border-sand">
                <div>
                    <span class="text-xs font-semibold text-sage uppercase tracking-wider">My Clothes</span>
                    <h2 class="text-3xl font-serif font-bold text-charcoal">Digital Wardrobe</h2>
                </div>
                <p class="text-sm text-warmgray max-w-md">Snap pictures of your clothes or upload images to build your personalized digital wardrobe catalog.</p>
            </div>

            <div class="bg-white p-
